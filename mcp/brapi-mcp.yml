    accepts {metric}Min and {metric}Max, inclusive, in the units of the response: fractions use 0.06 for
    6% (dividendYield, returnOnEquity, margins, growth); changePercent uses 2.81 for 2.81%; prices and
    amounts are BRL. A filter drops assets without that value. Companies with a loss have a negative trailingPE,
    so for "P/L below 8" send trailingPEMin=0 and trailingPEMax=8. sortBy accepts any metric key, symbol,
    or name (default marketCap, desc); nulls sort last. page starts at 1; limit max 200, default 20. Startup
    and Pro plans. Pro metrics (returnOnEquity, returnOnAssets, grossMargin, ebitdaMargin, operatingMargin,
    debtToEquity, netDebtToEbitda, currentRatio, quickRatio, revenueGrowth, earningsGrowth, revenueGrowthAnnual,
    earningsGrowthAnnual, totalRevenue, ebitda, freeCashflow, totalDebt, totalCash) need the Pro plan:
    a filter or sort with them on Startup returns PLAN_LIMIT, and Startup results omit them. The free
    plan has no access.


