description: >-
  brapi.dev is a Brazilian financial data REST API aggregating public market data from B3 (stock exchange), CVM
  (securities commission), and Banco Central (central bank). It provides real-time and historical stock quotes,
  fundamentals, dividends, cryptocurrency prices in BRL, foreign exchange rates, and economic indicators such as IPCA,
  IGPM, and SELIC. With over 20,000 active developers, brapi.dev offers tiered subscription plans from free to Pro, with
  up to 500,000 requests per month and data updated every 5 minutes.
