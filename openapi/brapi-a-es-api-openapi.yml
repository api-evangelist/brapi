      - Ações
      operationId: getStockStatistics
      summary: Múltiplos de ações
      description: 'Múltiplos e indicadores por ação: P/L, P/VP, beta, dividend yield, lucro por ação, valor patrimonial por ação e market cap.


        Use para comparar empresas, montar screeners e acompanhar valuation.


        O padrão `mode=current` traz o valor atual. `mode=history` traz a série anual ou trimestral, conforme `period`, filtrada por `startDate` e `endDate`.


        Múltiplos que usam o preço mudam a cada pregão. Múltiplos que usam só o balanço mudam quando a empresa publica um novo resultado.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula. Ex.: PETR4,VALE3. `requestedSymbol` identifica o ticker enviado e `symbol` identifica os dados retornados.'
          example: PETR4,VALE3
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          enum:
          - annual
          - quarterly
          default: annual
          description: 'Período de cada linha: anual ou trimestral.'
          example: annual
        required: false
        name: period
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD. Filtra pela data de encerramento do período.
          example: '2024-01-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD. Filtra pela data de encerramento do período.
          example: '2024-12-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - current
