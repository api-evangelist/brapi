openapi: 3.2.0
info:
  title: brapi - API do Mercado Financeiro Brasileiro Ações API
  version: 3.0.0
  description: 'Dados do mercado financeiro brasileiro: ações, FIIs, fundos, BDRs, ETFs, índices, opções, futuros, Tesouro Direto, câmbio, criptomoedas e séries macroeconômicas.


    Envie a chave no header `Authorization: Bearer `. Crie a conta em https://brapi.dev/login e pegue a chave em https://brapi.dev/dashboard. PETR4, MGLU3, VALE3 e ITUB4 funcionam sem chave.


    Use as rotas em `/api/v2` em integrações novas. Uma rota descontinuada envia `Deprecation: true`, `Sunset: ` e um header `Link` com a rota que a substitui. A política está em https://brapi.dev/docs/versioning.


    SDKs oficiais: `npm install brapi` (https://github.com/brapi-dev/brapi-typescript) e `pip install brapi` (https://github.com/brapi-dev/brapi-python). Documentação: https://brapi.dev/docs'
  contact:
    name: brapi
    url: https://brapi.dev
    email: contato@brapi.dev
  externalDocs:
    description: Política de versionamento e descontinuação
    url: https://brapi.dev/versioning.md
  x-brapi-versioning:
    strategy: url
    currentVersion: v2
    policyUrl: https://brapi.dev/versioning.md
    deprecationHeaders:
    - Deprecation
    - Sunset
    - Link
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://brapi.dev
  description: Servidor principal da API brapi
- url: http://localhost:3001
  description: Servidor local para desenvolvimento
tags:
- name: Ações
paths:
  /api/v2/stocks/insider-transactions:
    get:
      operationId: getStockInsiderTransactions
      tags:
      - Ações
      summary: Negociações de administradores e pessoas vinculadas
      description: 'Movimentações de valores mobiliários por administradores, controladores e pessoas vinculadas, por empresa e período. Os relatórios são mensais. A atualização ocorre semanalmente.


        O ticker identifica a empresa do relatório. PETR3 e PETR4 retornam os mesmos dados. Os registros agrupam pessoas por cargo, sem identificar cada pessoa ou o ticker negociado.


        `direction` indica entrada ou saída da posição, inclusive transferências. Use `movementType` para identificar compras e vendas.


        A resposta traz as movimentações mais recentes primeiro e a última versão de cada relatório. Use `allVersions=true` para incluir versões anteriores. Não some essas versões, pois elas podem repetir movimentações. Saldos iniciais não entram na lista.


        Plano Pro. PETR4, MGLU3, VALE3 e ITUB4 permitem testes gratuitos, sem token.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 300
          description: Tickers separados por vírgula. Máximo de 20. Cada ticker identifica a empresa que apresenta o relatório.
          example: VALE3
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          description: 'Data inicial da movimentação. Padrão: 365 dias antes de endDate.'
          example: '2026-08-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: 'Data final da movimentação. Padrão: hoje.'
          example: '2026-08-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - company
          - parent
          - subsidiary
          - all
          default: company
          description: 'Empresa que emite o valor mobiliário: a própria empresa, sua controladora ou sua controlada.'
        required: false
        name: companyRelation
        in: query
      - schema:
          type: string
          enum:
          - credit
          - debit
          description: Entrada ou saída da posição. Inclui transferências e outras movimentações.
        required: false
        name: direction
        in: query
      - schema:
          type: string
          enum:
          - controller
          - board
          - director
          - fiscalCouncil
          - statutoryBody
          description: Grupo de cargos. Cada grupo inclui pessoas vinculadas.
        required: false
        name: roleGroup
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 150
          description: Tipo de movimentação, com o texto exato do relatório.
          example: Compra à vista
        required: false
        name: movementType
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: 'Inclui versões anteriores dos relatórios. Padrão: false. Versões anteriores podem repetir movimentações.'
        required: false
        name: allVersions
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
          description: Página de cada empresa.
        required: false
        name: page
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Máximo de movimentações por empresa e página.
          example: 1
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: Movimentações por empresa, com paginação independente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsiderTransactionResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '429':
          description: Limite de requisições excedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Limite de requisições excedido.
                  example:
                    error: true
                    message: Limite de requisições excedido. Tente novamente mais tarde.
                    code: RATE_LIMIT_EXCEEDED
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Serviço temporariamente indisponível. Tente de novo em alguns minutos.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Serviço temporariamente indisponível.
                  example:
                    error: true
                    message: Serviço externo temporariamente indisponível. Tente novamente em alguns minutos.
                    code: EXTERNAL_API_ERROR
  /api/v2/stocks/screener:
    get:
      operationId: getStockScreener
      tags:
      - Ações
      summary: Filtrar ações por indicadores
      description: 'Filtra e ordena ações da B3 por preço e indicadores fundamentalistas, como P/L, P/VP, dividend yield e ROE. Uma chamada percorre todas as ações.


        Cada indicador aceita `{chave}Min` e `{chave}Max`. Os limites são inclusivos e usam a mesma unidade da resposta. Frações seguem `/api/v2/stocks/statistics` e `/api/v2/stocks/financial-data`: 6% é `0.06`. Um filtro remove os ativos sem o dado. Na ordenação, os nulos ficam no fim.


        Exemplos:


        - P/L entre 0 e 8 e dividend yield de pelo menos 6%: `?trailingPEMin=0&trailingPEMax=8÷ndYieldMin=0.06&sortBy=dividendYield`

        - ROE de pelo menos 15%, do maior para o menor: `?returnOnEquityMin=0.15&sortBy=returnOnEquity`


        Empresas com prejuízo têm P/L negativo. Para excluí-las, envie `trailingPEMin=0` junto com `trailingPEMax`.


        `quote` e `dividendYield` usam o último preço. P/L, P/VP e os outros indicadores usam o preço da atualização diária dos fundamentos. Em units, P/L e P/VP usam o último preço da unit. `dividendYield` soma os proventos em dinheiro dos últimos 12 meses.


        Planos Startup e Pro. Os indicadores do plano Pro não vêm em `metrics` no plano Startup. Um filtro ou uma ordenação com esses indicadores no plano Startup retorna 403.


        | Indicador | Chave | Unidade | Plano |

        | --- | --- | --- | --- |

        | Preço | `lastPrice` | reais | Startup e Pro |

        | Variação no dia | `changePercent` | porcentagem (2.81 = 2,81%) | Startup e Pro |

        | Volume | `volume` | ações | Startup e Pro |

        | Valor de mercado | `marketCap` | reais | Startup e Pro |

        | P/L | `trailingPE` | múltiplo | Startup e Pro |

        | P/VP | `priceToBook` | múltiplo | Startup e Pro |

        | EV/EBITDA | `enterpriseToEbitda` | múltiplo | Startup e Pro |

        | EV/Receita | `enterpriseToRevenue` | múltiplo | Startup e Pro |

        | PEG | `pegRatio` | múltiplo | Startup e Pro |

        | LPA | `earningsPerShare` | reais | Startup e Pro |

        | VPA | `bookValuePerShare` | reais | Startup e Pro |

        | Margem líquida | `netMargin` | fração (0.06 = 6%) | Startup e Pro |

        | Valor da firma | `enterpriseValue` | reais | Startup e Pro |

        | Variação 52 semanas | `fiftyTwoWeekChange` | fração (0.06 = 6%) | Startup e Pro |

        | Dividend yield | `dividendYield` | fração (0.06 = 6%) | Startup e Pro |

        | ROE | `returnOnEquity` | fração (0.06 = 6%) | Pro |

        | ROA | `returnOnAssets` | fração (0.06 = 6%) | Pro |

        | Margem bruta | `grossMargin` | fração (0.06 = 6%) | Pro |

        | Margem EBITDA | `ebitdaMargin` | fração (0.06 = 6%) | Pro |

        | Margem operacional | `operatingMargin` | fração (0.06 = 6%) | Pro |

        | Dívida/PL | `debtToEquity` | múltiplo | Pro |

        | Dívida líquida/EBITDA | `netDebtToEbitda` | múltiplo | Pro |

        | Liquidez corrente | `currentRatio` | múltiplo | Pro |

        | Liquidez seca | `quickRatio` | múltiplo | Pro |

        | Crescimento da receita | `revenueGrowth` | fração (0.06 = 6%) | Pro |

        | Crescimento do lucro | `earningsGrowth` | fração (0.06 = 6%) | Pro |

        | Crescimento anual da receita | `revenueGrowthAnnual` | fração (0.06 = 6%) | Pro |

        | Crescimento anual do lucro | `earningsGrowthAnnual` | fração (0.06 = 6%) | Pro |

        | Receita | `totalRevenue` | reais | Pro |

        | EBITDA | `ebitda` | reais | Pro |

        | Fluxo de caixa livre | `freeCashflow` | reais | Pro |

        | Dívida bruta | `totalDebt` | reais | Pro |

        | Caixa | `totalCash` | reais | Pro |'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Parte do ticker, do nome da empresa ou de um ticker antigo.
          example: BANCO
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - stock
          - fund
          - bdr
          default: stock
          description: 'Tipo do ativo. Padrão: `stock`.'
          example: stock
        required: false
        name: type
        in: query
      - schema:
          type: string
          enum:
          - stock
          - unit
          - fii
          - etf
          - fi-infra
          - fi-agro
          - fip
          - fidc
          - bdr
          description: 'Subtipo do ativo: stock, unit, fii, etf, fi-infra, fi-agro, fip, fidc ou bdr.'
          example: unit
        required: false
        name: subType
        in: query
      - schema:
          type: string
          description: Setor. Aceita parte do nome.
          example: Finance
        required: false
        name: sector
        in: query
      - schema:
          type: string
          description: Subsetor. Nome exato.
          example: Energia Elétrica
        required: false
        name: subsector
        in: query
      - schema:
          type: string
          enum:
          - symbol
          - name
          - lastPrice
          - changePercent
          - volume
          - marketCap
          - trailingPE
          - priceToBook
          - enterpriseToEbitda
          - enterpriseToRevenue
          - pegRatio
          - earningsPerShare
          - bookValuePerShare
          - netMargin
          - enterpriseValue
          - fiftyTwoWeekChange
          - dividendYield
          - returnOnEquity
          - returnOnAssets
          - grossMargin
          - ebitdaMargin
          - operatingMargin
          - debtToEquity
          - netDebtToEbitda
          - currentRatio
          - quickRatio
          - revenueGrowth
          - earningsGrowth
          - revenueGrowthAnnual
          - earningsGrowthAnnual
          - totalRevenue
          - ebitda
          - freeCashflow
          - totalDebt
          - totalCash
          default: marketCap
          description: 'Campo de ordenação: uma chave de métrica, `symbol` ou `name`. Valores nulos ficam no fim.'
          example: dividendYield
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: 'Ordem. Padrão: `desc`.'
          example: desc
        required: false
        name: sortOrder
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000
          default: 1
          description: Número da página. Começa em 1.
          example: 1
        required: false
        name: page
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 200
          default: 20
          description: 'Itens por página. Máximo: 200.'
          example: 20
        required: false
        name: limit
        in: query
      - schema:
          type: number
          description: 'Preço: valor mínimo, inclusive. Unidade: reais. Plano Startup e Pro.'
        required: false
        name: lastPriceMin
        in: query
      - schema:
          type: number
          description: 'Preço: valor máximo, inclusive. Unidade: reais. Plano Startup e Pro.'
        required: false
        name: lastPriceMax
        in: query
      - schema:
          type: number
          description: 'Variação no dia: valor mínimo, inclusive. Unidade: porcentagem (2.81 = 2,81%). Plano Startup e Pro.'
        required: false
        name: changePercentMin
        in: query
      - schema:
          type: number
          description: 'Variação no dia: valor máximo, inclusive. Unidade: porcentagem (2.81 = 2,81%). Plano Startup e Pro.'
        required: false
        name: changePercentMax
        in: query
      - schema:
          type: number
          description: 'Volume: valor mínimo, inclusive. Unidade: ações. Plano Startup e Pro.'
        required: false
        name: volumeMin
        in: query
      - schema:
          type: number
          description: 'Volume: valor máximo, inclusive. Unidade: ações. Plano Startup e Pro.'
        required: false
        name: volumeMax
        in: query
      - schema:
          type: number
