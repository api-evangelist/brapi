  /api/v2/stocks/quote:
    get:
      tags:
      - Ações
      operationId: getStockQuotes
      summary: Cotação de ações
      description: 'Preço, variação, volume, market cap, máxima e mínima do dia, faixa de 52 semanas e logo de ações, FIIs, BDRs, ETFs, units e índices brasileiros.


        Use para telas de cotação, carteiras, alertas de preço e widgets.


        Envie vários tickers em `symbols`, separados por vírgula. O número máximo de tickers por chamada depende do plano.


        Quando alguns tickers não existem, eles ficam fora de `results`. Se nenhum ticker tem cotação, a resposta retorna 404.


        Um ticker antigo é trocado pelo ticker atual. Nesse caso, `changed` é `true` e `requestedSymbol` guarda o ticker enviado.


        AXIA5 e AXIA6 retornam a cotação de uma ação AXIA3. Consulte a resolução de tickers para ver a proporção de conversão.


        Para a série de preços, use o histórico de preços. Para achar tickers válidos, use a lista de tickers.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula. Ex.: PETR4,VALE3. `requestedSymbol` identifica o ticker enviado e `symbol` identifica os dados retornados.'
          example: PETR4,VALE3
        required: true
        name: symbols
        in: query
      responses:
        '200':
          description: Cotações recuperadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockQuoteResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
