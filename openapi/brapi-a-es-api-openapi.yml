  /api/v2/stocks/historical:
    get:
      tags:
      - Ações
      operationId: getStockHistorical
      summary: Histórico de preços de ações
      description: 'Série de preços por pregão com abertura, máxima, mínima, fechamento, fechamento ajustado e volume. Serve para ações, FIIs, BDRs, ETFs, units e índices com histórico.


        Use para gráficos, backtests e cálculo de retorno.


        Em conversões de ações, use o ticker original para consultar o histórico daquela classe. Por exemplo, AXIA6 mantém seu próprio histórico.


        LCAM3 e BRFS3 também mantêm históricos próprios, separados de RENT3 e MBRF3. PRGA3 usa a série de BRFS3. MRFG3 usa MBRF3.


        O histórico disponível pode ser consultado mesmo quando o ticker não tem cotação atual.


        Defina a janela com `range` e `interval`, por exemplo `range=1y&interval=1d`, ou com `startDate` e `endDate`. O padrão é `range=1mo` e `interval=1d`.


        O plano define os valores aceitos em `range` e `interval` e o tamanho máximo da janela por data. Um pedido acima do limite do plano retorna erro 400.


        Em intervalos diários, `open`, `high`, `low` e `close` podem vir ajustados. Nesses pontos, `close` coincide com `adjustedClose`. Outros pontos podem trazer `close` sem ajuste ou `adjustedClose` nulo. Os campos `raw*`, quando disponíveis, trazem os preços originais.


        Use `adjustedClose` para calcular retorno diário. Ele considera proventos, desdobramentos e grupamentos.


        `includeRaw=true` exige o plano Pro. Em intervalos diários, ele adiciona `rawOpen`, `rawHigh`, `rawLow` e `rawClose`, os preços originais sem ajuste. Esses campos podem ser nulos. Intervalos intradiários não trazem campos `raw*`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula. Ex.: PETR4,VALE3. `requestedSymbol` identifica o ticker enviado e `symbol` identifica os dados retornados.'
          example: PETR4,VALE3
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          enum:
          - 1d
          - 2d
          - 5d
          - 7d
          - 1mo
          - 3mo
          - 6mo
          - 1y
          - 2y
          - 5y
          - 10y
          - ytd
          - max
          description: 'Janela relativa. Padrão: 1mo.'
          example: 1y
        required: false
        name: range
        in: query
      - schema:
          type: string
          enum:
          - 1m
          - 2m
          - 5m
          - 15m
          - 30m
          - 60m
          - 90m
          - 1h
          - 1d
          - 5d
          - 1wk
          - 1mo
          - 3mo
          description: 'Intervalo entre os pontos. Padrão: 1d.'
          example: 1d
        required: false
        name: interval
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2024-01-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD. Sem `startDate`, `range` conta para trás a partir desta data.
          example: '2024-12-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Ordem dos pontos por data.
          example: desc
        required: false
        name: sortOrder
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Inclui os preços originais sem ajuste (`rawOpen`, `rawHigh`, `rawLow`, `rawClose`) em intervalos diários. Exige o plano Pro.
          example: 'true'
        required: false
        name: includeRaw
        in: query
      responses:
        '200':
          description: Histórico recuperado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockHistoricalResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '429':
          description: Limite de requisições excedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Limite de requisições excedido.
                  example:
                    error: true
                    message: Limite de requisições excedido. Tente novamente mais tarde.
                    code: RATE_LIMIT_EXCEEDED
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/stocks/dividends:
    get:
      tags:
      - Ações
      operationId: getStockDividends
      summary: Dividendos de ações
      description: 'Proventos de ações brasileiras: dividendos, JCP, bonificações, desdobramentos, grupamentos e subscrições, com valor por ação, data-com, data ex e data de pagamento.


        Use para calcular dividend yield, montar calendários de proventos e registrar proventos em carteiras.


        Em conversões de ações, os proventos de cada classe permanecem separados. Uma consulta por AXIA6 retorna os proventos de AXIA6 e ELET6.


        Os proventos de LCAM3 e BRFS3 permanecem separados de RENT3 e MBRF3. PRGA3 usa BRFS3. MRFG3 usa MBRF3.


        Os proventos disponíveis podem ser consultados mesmo quando o ticker não tem cotação atual.


        `lastDatePrior` é a data-com, o último dia para comprar a ação e ter direito ao provento. `exDate` é a data ex, o primeiro dia sem esse direito. `exDate` pode ser nulo.


        `startDate` e `endDate` filtram proventos em dinheiro por `paymentDate` e eventos em ações por `lastDatePrior`.


        `includeRaw=true` exige o plano Pro. Ele adiciona `rawRate`, o valor por ação na escala dos preços sem ajuste.


        FIIs não entram aqui. Um ticker de FII retorna erro 400. Use dividendos de FIIs.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula. Ex.: PETR4,VALE3. `requestedSymbol` identifica o ticker enviado e `symbol` identifica os dados retornados.'
          example: PETR4,VALE3
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD. Filtra proventos em dinheiro por `paymentDate` e eventos em ações por `lastDatePrior`.
          example: '2024-01-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD. Filtra proventos em dinheiro por `paymentDate` e eventos em ações por `lastDatePrior`.
          example: '2024-12-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - paymentDate
          - lastDatePrior
          - approvedOn
          - rate
          default: paymentDate
          description: Campo de ordenação dos eventos.
          example: paymentDate
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Ordem dos eventos.
          example: desc
        required: false
        name: sortOrder
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Inclui `rawRate`, o valor por ação na escala dos preços sem ajuste. Exige o plano Pro.
          example: 'true'
        required: false
        name: includeRaw
        in: query
      responses:
