  /api/v2/options/analytics:
    get:
      tags:
      - Opções
      operationId: getOptionAnalytics
      summary: Gregas e IV de opções
      description: 'Retorna a volatilidade implícita e as gregas (delta, gamma, theta, vega e rho) de cada série de um vencimento, calculadas sobre o preço de fechamento.


        Use para comparar a IV entre strikes, montar um smile de volatilidade e medir a exposição de uma carteira de opções.


        `timeToExpirationYears` usa dias corridos até o vencimento divididos por 365. Por exemplo, 17 dias correspondem a `17 / 365 = 0.04657534`.


        `impliedVolatility` é anual, em decimal. Para um dia corrido, use `impliedVolatility / sqrt(365)`. Para `d` dias corridos, use `impliedVolatility * sqrt(d / 365)`.


        A divisão por `sqrt(252)` pressupõe 252 pregões por ano. Ela expressa outra convenção diária e não altera o prazo usado no cálculo da opção.


        O cálculo usa só o fechamento negociado. Série sem negócio no dia não tem cálculo: os campos calculados vêm `null` e `nullReason` diz o motivo.


        `theta` vem por ano. `vega` e `rho` medem o efeito de uma variação de 1,00 na volatilidade e no juro. Divida por 100 para ter o efeito de 1 ponto percentual.


        Séries americanas usam árvore binomial. Séries europeias usam Black-Scholes-Merton. `dividendYield` considera só os dividendos anunciados até a data do cálculo.


        Disponível no plano Pro. Sem token, aceita só `underlying=PETR4`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Ticker do ativo subjacente: ação, ETF, índice, `DOL` ou `WDO`.'
          example: PETR4
        required: true
        name: underlying
        in: query
      - schema:
          type: string
          description: Data de vencimento, no formato YYYY-MM-DD. Veja os vencimentos em `/expirations`.
          example: '2026-12-18'
        required: true
        name: expirationDate
        in: query
      - schema:
          type: string
          description: 'Data do pregão, no formato YYYY-MM-DD. Padrão: último pregão disponível.'
          example: '2026-06-01'
        required: false
        name: date
        in: query
      - schema:
          type: string
          enum:
          - call
          - put
          description: Filtra por `call` ou `put`. Sem o filtro, retorna os dois.
        required: false
        name: side
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike mínimo.
        required: false
        name: minStrike
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike máximo.
        required: false
        name: maxStrike
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          description: 'Número máximo de séries na resposta. Padrão: todas as séries do filtro.'
          example: 50
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: Análises retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionAnalyticsResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/options/analytics/history:
    get:
      tags:
      - Opções
      operationId: getOptionAnalyticsHistory
      summary: Histórico de gregas e IV
      description: 'Retorna o histórico diário de volatilidade implícita e gregas de uma série de opção, identificada por `symbol` e `expirationDate`.


        Use para ver como a IV reagiu a eventos, como balanço, decisão de juros ou o vencimento, e para testar estratégias com gregas.


        Os campos seguem as regras de gregas e IV. Se o mesmo `symbol` aparece duas vezes no vencimento, passe também `strike`.


        Disponível no plano Pro. Sem token, aceita só `symbol` com prefixo `PETR`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Código da série de opção.
          example: PETRF783
        required: true
        name: symbol
        in: query
      - schema:
          type: string
          description: Data de vencimento da série, no formato YYYY-MM-DD.
          example: '2026-12-18'
        required: true
        name: expirationDate
        in: query
      - schema:
          type: number
          nullable: true
          description: Preço de exercício. Use quando o mesmo `symbol` aparece mais de uma vez no vencimento.
          example: 7.29
        required: false
        name: strike
        in: query
      - schema:
          type: string
          description: 'Data inicial, no formato YYYY-MM-DD. Padrão: 12 meses atrás.'
          example: '2026-05-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: 'Data final, no formato YYYY-MM-DD. Padrão: hoje.'
          example: '2026-06-01'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: 'Ordem por data: `asc` do mais antigo ao mais recente, `desc` do mais recente ao mais antigo.'
        required: false
        name: sortOrder
        in: query
      responses:
        '200':
          description: Histórico de análises retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionAnalyticsHistoryResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
