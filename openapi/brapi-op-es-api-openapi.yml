  /api/v2/options/historical:
    get:
      tags:
      - Opções
      operationId: getOptionHistorical
      summary: Histórico de opção
      description: 'Retorna o histórico diário de uma série de opção, identificada por `symbol` e `expirationDate`: OHLC, bid, ask, negócios e volume por pregão.


        Use para montar gráficos de prêmio, fazer backtests e analisar a liquidez de uma série.


        Se o mesmo `symbol` aparece duas vezes no vencimento, passe também `strike`. Encontre a série na cadeia de opções.


        Séries fora do dinheiro passam dias sem negócio. Um pregão sem negócio não aparece no histórico.


        Disponível no plano Pro. Sem token, aceita só `symbol` com prefixo `PETR`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Código da série de opção.
          example: PETRF783
        required: true
        name: symbol
        in: query
      - schema:
          type: string
          description: Data de vencimento da série, no formato YYYY-MM-DD.
          example: '2026-12-18'
        required: true
        name: expirationDate
        in: query
      - schema:
          type: number
          nullable: true
          description: Preço de exercício. Use quando o mesmo `symbol` aparece mais de uma vez no vencimento.
          example: 7.29
        required: false
        name: strike
        in: query
      - schema:
          type: string
          description: 'Data inicial, no formato YYYY-MM-DD. Padrão: 12 meses atrás.'
          example: '2026-05-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: 'Data final, no formato YYYY-MM-DD. Padrão: hoje.'
          example: '2026-06-01'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: 'Ordem por data: `asc` do mais antigo ao mais recente, `desc` do mais recente ao mais antigo.'
        required: false
        name: sortOrder
        in: query
      responses:
        '200':
          description: Histórico retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionHistoricalResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
