  /api/v2/futures/options/analytics/history:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionAnalyticsHistory
      summary: Histórico de gregas e IV de opções sobre futuros
      description: 'Retorna o histórico diário de volatilidade implícita e gregas de uma opção sobre futuro, identificada por `symbol`.


        Use para ver como a IV reagiu a eventos, como relatórios de safra ou o vencimento, e para testar estratégias com gregas.


        Os campos seguem as regras de gregas e IV de opções sobre futuros.


        Disponível no plano Pro. Sem token, aceita só `symbol` com prefixo `BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Código da série de opção.
          example: BGIM26C028000
        required: true
        name: symbol
        in: query
      - schema:
          type: string
          description: 'Data inicial, no formato YYYY-MM-DD. Padrão: 12 meses atrás.'
          example: '2026-05-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: 'Data final, no formato YYYY-MM-DD. Padrão: hoje.'
          example: '2026-06-01'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: 'Ordem por data: `asc` do mais antigo ao mais recente, `desc` do mais recente ao mais antigo.'
        required: false
        name: sortOrder
        in: query
      responses:
        '200':
          description: Histórico de análises retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureOptionAnalyticsHistoryResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    FutureOptionAnalyticsQuote:
      type: object
      properties:
        symbol:
          type: string
          description: 'Código da série de opção. Ex.: `BGIH27C028550`.'
        underlyingAsset:
          type: string
          description: 'Código do ativo do futuro. Ex.: `BGI`.'
        underlyingFuture:
          type: string
          nullable: true
          description: Contrato futuro de base, quando informado.
        optionType:
          type: string
          enum:
          - call
          - put
          description: '`call` (opção de compra) ou `put` (opção de venda).'
        optionStyle:
          type: string
          nullable: true
          enum:
          - american
          - european
          description: '`american` permite exercício até o vencimento. `european` permite exercício só no vencimento.'
        segment:
          type: string
          enum:
          - financial
          - agribusiness
          description: 'Segmento do contrato: `financial` ou `agribusiness`.'
        strike:
          type: number
          description: Preço de exercício da opção, na unidade de cotação do futuro.
        expirationDate:
          type: string
          description: Data de vencimento, no formato YYYY-MM-DD.
        firstTradeDate:
          type: string
          nullable: true
          description: Data do primeiro pregão da série, no formato YYYY-MM-DD.
        lastTradeDate:
          type: string
          nullable: true
          description: Data do último pregão da série, no formato YYYY-MM-DD.
        contractMultiplier:
          type: number
          nullable: true
          description: 'Multiplicador do contrato, herdado do futuro. Ex.: 330 arrobas no boi gordo.'
        allocationRoundLot:
          type: integer
          nullable: true
          description: Lote padrão de negociação.
        exerciseType:
          type: string
          nullable: true
          description: Tipo de exercício.
        automaticExercise:
          type: boolean
          nullable: true
          description: '`true` quando a opção é exercida automaticamente no vencimento.'
        premiumUpfront:
          type: boolean
          nullable: true
          description: '`true` se o prêmio é pago à vista, `false` se é diferido.'
        isin:
          type: string
          nullable: true
          description: Código ISIN da série de opção.
        cficCode:
          type: string
          nullable: true
          description: Código CFI.
        date:
          type: string
          description: Data do pregão, no formato YYYY-MM-DD.
        model:
          type: string
          enum:
          - black-76
          - cox-ross-rubinstein-futures
          - unsupported
          description: Modelo de cálculo. Séries americanas usam árvore binomial sobre o futuro (`cox-ross-rubinstein-futures`). Séries europeias usam `black-76`. `unsupported` quando o estilo da opção é desconhecido.
        priceSource:
          type: string
          enum:
          - close
          - referencePrice
          - none
          description: Preço usado para calcular a IV. `close` é o fechamento negociado. Sem negócio, o cálculo usa `referencePrice`, com `confidence` igual a `low`.
        underlyingPrice:
          type: number
          nullable: true
          description: Preço do futuro subjacente usado no cálculo.
        optionPrice:
          type: number
          nullable: true
          description: Preço da opção usado para calcular a volatilidade implícita.
        riskFreeRate:
          type: number
          nullable: true
          description: 'Taxa livre de risco anual, em decimal. Ex.: 0.105 para 10,5%.'
        dividendYield:
          type: number
          nullable: true
          description: Sempre `0` em opções sobre futuros.
        timeToExpirationYears:
          type: number
          nullable: true
          description: Dias corridos até o vencimento divididos por 365, inclusive em anos bissextos.
        impliedVolatility:
          type: number
          nullable: true
          description: Volatilidade implícita anual, em decimal. O cálculo usa tempo em dias corridos dividido por 365.
        delta:
          type: number
          nullable: true
          description: Variação do prêmio para 1 unidade de variação no ativo subjacente.
        gamma:
          type: number
          nullable: true
          description: Variação do delta para 1 unidade de variação no ativo subjacente.
        theta:
          type: number
          nullable: true
          description: Variação do prêmio com a passagem do tempo, por ano.
        vega:
          type: number
          nullable: true
          description: Variação do prêmio para 1,00 de variação na volatilidade. Divida por 100 para 1 ponto percentual.
        rho:
          type: number
          nullable: true
          description: Variação do prêmio para 1,00 de variação na taxa de juro. Divida por 100 para 1 ponto percentual.
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - none
          description: Confiança do cálculo. `none` indica IV e gregas nulas, com o motivo em `nullReason`. `low` indica cálculo sobre `referencePrice`.
        nullReason:
          type: string
          nullable: true
          description: 'Motivo dos campos calculados nulos. Ex.: `no_trades`, `missing_underlying_price`, `iv_not_converged`.'
        openInterest:
          type: number
          nullable: true
          description: Contratos em aberto na série, na última apuração até a data pedida.
        openInterestChange:
          type: number
          nullable: true
          description: Variação de contratos em aberto desde a apuração anterior.
        openInterestDate:
          type: string
          nullable: true
          description: Data da apuração usada, no formato YYYY-MM-DD. Pode ser anterior à data do pregão.
      required:
      - symbol
      - underlyingAsset
      - underlyingFuture
      - optionType
      - optionStyle
      - segment
      - strike
      - expirationDate
      - firstTradeDate
      - lastTradeDate
      - contractMultiplier
      - allocationRoundLot
      - exerciseType
      - automaticExercise
      - premiumUpfront
      - isin
      - cficCode
      - date
      - model
      - priceSource
      - underlyingPrice
      - optionPrice
      - riskFreeRate
      - dividendYield
      - timeToExpirationYears
      - impliedVolatility
      - delta
      - gamma
      - theta
      - vega
      - rho
      - confidence
      - nullReason
      - openInterest
      - openInterestChange
      - openInterestDate
    FutureOptionPositionHistory:
      allOf:
      - $ref: '#/components/schemas/FutureOptionSpecs'
      - type: object
        properties:
          positions:
            type: array
            items:
              type: object
              properties:
                openInterest:
                  type: number
                  nullable: true
                  description: Contratos em aberto na série, na última apuração até a data pedida.
                openInterestChange:
                  type: number
                  nullable: true
                  description: Variação de contratos em aberto desde a apuração anterior.
                openInterestDate:
                  type: string
                  nullable: true
                  description: Data da apuração usada, no formato YYYY-MM-DD. Pode ser anterior à data do pregão.
                reportDate:
                  type: string
                  description: Data da apuração, no formato YYYY-MM-DD.
                isin:
                  type: string
                  nullable: true
                  description: Código ISIN da série de opção, não do contrato futuro.
                asset:
                  type: string
                  nullable: true
                  description: 'Código raiz do ativo objeto. Ex.: BGI.'
                expirationCode:
                  type: string
                  nullable: true
                  description: 'Código de vencimento da apuração. Ex.: VVNK.'
                reportSegment:
                  type: string
                  description: 'Segmento da apuração. Ex.: AGRIBUSINESS. É diferente do campo `segment` do contrato.'
                reportedOpenInterest:
                  type: number
                  nullable: true
                  description: Contratos em aberto na apuração do pregão. É a origem de `openInterest`.
                reportedOpenInterestChange:
                  type: number
                  nullable: true
                  description: Variação de contratos em aberto na apuração do pregão. É a origem de `openInterestChange`.
                distributionId:
                  type: string
                  nullable: true
                  description: Número de distribuição do ativo objeto. Vem vazio nas opções sobre futuros.
                coveredQuantity:
                  type: number
                  nullable: true
                  description: Contratos em posição coberta.
                blockedQuantity:
                  type: number
                  nullable: true
                  description: Contratos em posição bloqueada.
                uncoveredQuantity:
                  type: number
                  nullable: true
                  description: Contratos em posição descoberta.
                totalPositionQuantity:
                  type: number
                  nullable: true
                  description: Total de contratos em posição. Vem vazio na maior parte dos segmentos de futuros.
                borrowerQuantity:
                  type: number
                  nullable: true
                  description: Quantidade tomadora em empréstimo de ativos.
                lenderQuantity:
                  type: number
                  nullable: true
                  description: Quantidade doadora em empréstimo de ativos.
                currentQuantity:
                  type: number
                  nullable: true
                  description: Quantidade corrente. Preenchida só em alguns segmentos.
                forwardPrice:
                  type: number
                  nullable: true
                  description: Preço a termo. Preenchido só em alguns segmentos.
              required:
              - openInterest
              - openInterestChange
              - openInterestDate
              - reportDate
              - isin
              - asset
              - expirationCode
              - reportSegment
              - reportedOpenInterest
              - reportedOpenInterestChange
              - distributionId
              - coveredQuantity
              - blockedQuantity
              - uncoveredQuantity
              - totalPositionQuantity
              - borrowerQuantity
              - lenderQuantity
              - currentQuantity
              - forwardPrice
        required:
        - positions
