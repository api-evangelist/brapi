openapi: 3.2.0
info:
  title: brapi - API do Mercado Financeiro Brasileiro Opções sobre…
  version: 3.0.0
  description: 'Dados do mercado financeiro brasileiro: ações, FIIs, fundos, BDRs, ETFs, índices, opções, futuros, Tesouro Direto, câmbio, criptomoedas e séries macroeconômicas.


    Envie a chave no header `Authorization: Bearer `. Crie a conta em https://brapi.dev/login e pegue a chave em https://brapi.dev/dashboard. PETR4, MGLU3, VALE3 e ITUB4 funcionam sem chave.


    Use as rotas em `/api/v2` em integrações novas. Uma rota descontinuada envia `Deprecation: true`, `Sunset: ` e um header `Link` com a rota que a substitui. A política está em https://brapi.dev/docs/versioning.


    SDKs oficiais: `npm install brapi` (https://github.com/brapi-dev/brapi-typescript) e `pip install brapi` (https://github.com/brapi-dev/brapi-python). Documentação: https://brapi.dev/docs'
  contact:
    name: brapi
    url: https://brapi.dev
    email: contato@brapi.dev
  externalDocs:
    description: Política de versionamento e descontinuação
    url: https://brapi.dev/versioning.md
  x-brapi-versioning:
    strategy: url
    currentVersion: v2
    policyUrl: https://brapi.dev/versioning.md
    deprecationHeaders:
    - Deprecation
    - Sunset
    - Link
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://brapi.dev
  description: Servidor principal da API brapi
- url: http://localhost:3001
  description: Servidor local para desenvolvimento
tags:
- name: Opções sobre Futuros
paths:
  /api/v2/futures/options/expirations:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionExpirations
      summary: Vencimentos de opções sobre futuros
      description: 'Retorna as datas de vencimento de opções sobre um contrato futuro, como boi gordo (`BGI`), café arábica (`ICF`), milho (`CCM`) e soja (`SJC`). Por padrão, só vencimentos futuros.


        Use para montar um seletor de vencimento, listar vencimentos passados em um backtest e escolher a data antes de consultar a cadeia de opções sobre futuros.


        Passe `includeExpired=true` para incluir vencimentos passados. O vencimento da opção pode ser diferente do vencimento do futuro. Não calcule uma data a partir da outra.


        Disponível no plano Pro. Sem token, aceita só `underlying=BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Código do ativo do futuro. Ex.: `BGI`, `ICF`.'
          example: BGI
        required: true
        name: underlying
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
          description: '`true` inclui vencimentos passados. Padrão: `false`, só vencimentos futuros.'
        required: false
        name: includeExpired
        in: query
      responses:
        '200':
          description: Vencimentos retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureOptionExpirationsResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/futures/options/strikes:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionStrikes
      summary: Strikes de opções sobre futuros
      description: 'Retorna os preços de exercício das séries de opções sobre futuro de um vencimento, em ordem crescente. Filtre por `call` ou `put` com `side`.


        Use para montar um seletor de strike sem baixar a cadeia inteira.


        Este passo é opcional: a cadeia de opções sobre futuros também aceita `minStrike` e `maxStrike`.


        Disponível no plano Pro. Sem token, aceita só `underlying=BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Código do ativo do futuro. Ex.: `BGI`.'
          example: BGI
        required: true
        name: underlying
        in: query
      - schema:
          type: string
          description: Data de vencimento, no formato YYYY-MM-DD. Veja os vencimentos em `/expirations`.
          example: '2027-08-31'
        required: true
        name: expirationDate
        in: query
      - schema:
          type: string
          enum:
          - call
          - put
          description: Filtra por `call` ou `put`. Sem o filtro, retorna os dois.
        required: false
        name: side
        in: query
      responses:
        '200':
          description: Preços de exercício retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureOptionStrikesResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/futures/options/chain:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionChain
      summary: Cadeia de opções sobre futuros
      description: 'Retorna as calls e puts de um vencimento de opções sobre futuro, com dados do contrato (`symbol`, `optionType`, `optionStyle`, `strike`, `contractMultiplier`) e a cotação do pregão: OHLC, `referencePrice`, volume e contratos em aberto.


        Use para montar uma tela de opções por vencimento, comparar calls e puts por strike e filtrar séries por faixa de strike.


        Todas as séries vêm do mesmo pregão: o último com dados até a data pedida, informado em `date`. Séries sem registro nesse pregão não aparecem.


        Muitas séries não negociam todo dia. Sem negócio, `close` vem `null` e `referencePrice` costuma vir preenchido.


        Disponível no plano Pro. Sem token, aceita só `underlying=BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Código do ativo do futuro. Ex.: `BGI`.'
          example: BGI
        required: true
        name: underlying
        in: query
      - schema:
          type: string
          description: Data de vencimento, no formato YYYY-MM-DD. Veja os vencimentos em `/expirations`.
          example: '2027-08-31'
        required: true
        name: expirationDate
        in: query
      - schema:
          type: string
          description: 'Data do pregão, no formato YYYY-MM-DD. Padrão: último pregão disponível.'
        required: false
        name: date
        in: query
      - schema:
          type: string
          enum:
          - call
          - put
          description: Filtra por `call` ou `put`. Sem o filtro, retorna os dois.
        required: false
        name: side
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike mínimo.
        required: false
        name: minStrike
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike máximo.
        required: false
        name: maxStrike
        in: query
      responses:
        '200':
          description: Séries retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureOptionChainResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/futures/options/positions:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionPositions
      summary: Posições em aberto de opções sobre futuros
      description: 'Retorna os contratos em aberto de cada série de opções sobre futuro de um vencimento.


        Use para ver onde se concentram as posições por strike, comparar calls e puts e acompanhar a variação diária de contratos em aberto.


        Use `openInterest` como número de contratos em aberto. Aqui ele repete `reportedOpenInterest`. Os campos de posição coberta, descoberta, bloqueada e de empréstimo vêm vazios na maior parte dos segmentos de futuros. Volume e contratos em aberto medem coisas diferentes: uma série pode ficar sem negócio e ter muitos contratos em aberto.


        Os contratos em aberto são apurados uma vez por pregão. Sem apuração na data pedida, a resposta traz a anterior. Confira `openInterestDate` antes de comparar com o preço do dia.


        Aceita os mesmos filtros da cadeia de opções sobre futuros: `side`, `minStrike` e `maxStrike`.


        Disponível no plano Pro. Sem token, aceita só `underlying=BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Código do ativo do futuro. Ex.: `BGI`.'
          example: BGI
        required: true
        name: underlying
        in: query
      - schema:
          type: string
          description: Data de vencimento, no formato YYYY-MM-DD. Veja os vencimentos em `/expirations`.
          example: '2027-08-31'
        required: true
