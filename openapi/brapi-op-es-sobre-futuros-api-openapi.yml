        in: query
      - schema:
          type: string
          description: 'Data do pregão, no formato YYYY-MM-DD. Padrão: último pregão disponível.'
        required: false
        name: date
        in: query
      - schema:
          type: string
          enum:
          - call
          - put
          description: Filtra por `call` ou `put`. Sem o filtro, retorna os dois.
        required: false
        name: side
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike mínimo.
        required: false
        name: minStrike
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike máximo.
        required: false
        name: maxStrike
        in: query
      responses:
        '200':
          description: Posições retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureOptionPositionsResponse'
        '400':
