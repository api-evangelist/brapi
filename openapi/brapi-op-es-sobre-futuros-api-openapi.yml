  /api/v2/futures/options/historical:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionHistorical
      summary: Histórico de opção sobre futuro
      description: 'Retorna o histórico diário de uma opção sobre futuro, identificada por `symbol`: dados do contrato e, por pregão, OHLC, `referencePrice`, `oscillationPct`, negócios e volume.


        Use para montar gráficos de prêmio, fazer backtests e analisar a liquidez de uma série.


        Encontre a série na cadeia de opções sobre futuros. Séries longe do preço do futuro quase não negociam, e o histórico pode ter poucos pregões.


        Disponível no plano Pro. Sem token, aceita só `symbol` com prefixo `BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: Código da série de opção.
          example: BGIM26C028000
        required: true
        name: symbol
        in: query
      - schema:
          type: string
          description: 'Data inicial, no formato YYYY-MM-DD. Padrão: 12 meses atrás.'
          example: '2026-05-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: 'Data final, no formato YYYY-MM-DD. Padrão: hoje.'
          example: '2026-06-01'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: 'Ordem por data: `asc` do mais antigo ao mais recente, `desc` do mais recente ao mais antigo.'
        required: false
        name: sortOrder
        in: query
      responses:
        '200':
          description: Histórico retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureOptionHistoricalResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
