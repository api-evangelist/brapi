  /api/v2/futures/options/analytics:
    get:
      tags:
      - Opções sobre Futuros
      operationId: getFutureOptionAnalytics
      summary: Gregas e IV de opções sobre futuros
      description: 'Retorna a volatilidade implícita e as gregas (delta, gamma, theta, vega e rho) de cada série de opções sobre futuro de um vencimento, calculadas sobre o preço de fechamento.


        Use para comparar a IV entre strikes, montar um smile de volatilidade e medir a exposição de uma carteira de opções.


        `timeToExpirationYears` usa dias corridos até o vencimento divididos por 365. Por exemplo, 17 dias correspondem a `17 / 365 = 0.04657534`.


        `impliedVolatility` é anual, em decimal. Para um dia corrido, use `impliedVolatility / sqrt(365)`. Para `d` dias corridos, use `impliedVolatility * sqrt(d / 365)`.


        A divisão por `sqrt(252)` pressupõe 252 pregões por ano. Ela expressa outra convenção diária e não altera o prazo usado no cálculo da opção.


        Sem negócio no dia, o cálculo usa `referencePrice`. Nesses casos, `priceSource` vem `referencePrice` e `confidence` vem `low`. Sem preço, os campos calculados vêm `null` e `nullReason` diz o motivo.


        `theta` vem por ano. `vega` e `rho` medem o efeito de uma variação de 1,00 na volatilidade e no juro. Divida por 100 para ter o efeito de 1 ponto percentual.


        Séries americanas usam árvore binomial sobre o futuro. Séries europeias usam Black-76. A maioria das opções sobre futuros é americana.


        Disponível no plano Pro. Sem token, aceita só `underlying=BGI`.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Código do ativo do futuro. Ex.: `BGI`.'
          example: BGI
        required: true
        name: underlying
        in: query
      - schema:
          type: string
          description: Data de vencimento, no formato YYYY-MM-DD. Veja os vencimentos em `/expirations`.
          example: '2027-08-31'
        required: true
        name: expirationDate
        in: query
      - schema:
          type: string
          description: 'Data do pregão, no formato YYYY-MM-DD. Padrão: último pregão disponível.'
        required: false
        name: date
        in: query
      - schema:
          type: string
          enum:
          - call
          - put
          description: Filtra por `call` ou `put`. Sem o filtro, retorna os dois.
        required: false
        name: side
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike mínimo.
        required: false
        name: minStrike
        in: query
      - schema:
          type: number
          nullable: true
          description: Strike máximo.
        required: false
        name: maxStrike
        in: query
      - schema:
          type: integer
