  /api/v2/funds/nav/history:
    get:
      tags:
      - Fundos
      operationId: getFundNavHistory
      security:
      - Bearer: []
      summary: Histórico da cota
      description: 'Série do valor patrimonial por cota, com patrimônio, ativos, cotistas, aplicações e resgates. FI e FIF podem ter pontos diários. A cobertura varia por CNPJ. Alguns fundos não têm histórico disponível. FIDC tem pontos mensais por classe ou série, com a rentabilidade do mês em `monthlyReturn`.


        Use para gráficos de valor da cota, cálculo de rentabilidade e acompanhamento do patrimônio.


        Informe `symbols` ou `cnpjs`. Os filtros de data usam o campo `date`.


        Este é o valor patrimonial, não o preço negociado em bolsa. Para comparar um FI com um FIDC, alinhe os pontos por mês.


        Plano Pro.'
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula, até 20. Ex.: JURO11,XPCA11.'
          example: JURO11
        required: false
        example: JURO11
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs separados por vírgula, até 20, com ou sem pontuação.
          example: '42730834000100'
        required: false
        example: '42730834000100'
        name: cnpjs
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2026-01-01'
        required: false
        example: '2026-01-01'
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD.
          example: '2026-06-30'
        required: false
        example: '2026-06-30'
        name: endDate
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
          description: Número da página, a partir de 1.
          example: 1
        required: false
        example: 1
        name: page
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 20
          description: Itens por página.
          example: 20
        required: false
        example: 20
        name: limit
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Ordem crescente (`asc`) ou decrescente (`desc`).
          example: desc
        required: false
        example: desc
        name: sortOrder
        in: query
      responses:
        '200':
          description: Histórico do valor da cota
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundNavHistory'
                  pagination:
                    $ref: '#/components/schemas/FundPaginationMeta'
                  requestedAt:
                    type: string
                    format: date-time
                    description: Data e hora da requisição em ISO 8601.
                    example: '2025-01-24T17:32:38.000Z'
                  took:
                    type: integer
                    minimum: 0
                    description: Tempo de processamento, em milissegundos.
                    example: 45
                required:
                - history
                - pagination
