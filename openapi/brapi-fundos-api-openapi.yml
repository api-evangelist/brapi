openapi: 3.2.0
info:
  title: brapi - API do Mercado Financeiro Brasileiro Fundos API
  version: 3.0.0
  description: 'Dados do mercado financeiro brasileiro: ações, FIIs, fundos, BDRs, ETFs, índices, opções, futuros, Tesouro Direto, câmbio, criptomoedas e séries macroeconômicas.


    Envie a chave no header `Authorization: Bearer `. Crie a conta em https://brapi.dev/login e pegue a chave em https://brapi.dev/dashboard. PETR4, MGLU3, VALE3 e ITUB4 funcionam sem chave.


    Use as rotas em `/api/v2` em integrações novas. Uma rota descontinuada envia `Deprecation: true`, `Sunset: ` e um header `Link` com a rota que a substitui. A política está em https://brapi.dev/docs/versioning.


    SDKs oficiais: `npm install brapi` (https://github.com/brapi-dev/brapi-typescript) e `pip install brapi` (https://github.com/brapi-dev/brapi-python). Documentação: https://brapi.dev/docs'
  contact:
    name: brapi
    url: https://brapi.dev
    email: contato@brapi.dev
  externalDocs:
    description: Política de versionamento e descontinuação
    url: https://brapi.dev/versioning.md
  x-brapi-versioning:
    strategy: url
    currentVersion: v2
    policyUrl: https://brapi.dev/versioning.md
    deprecationHeaders:
    - Deprecation
    - Sunset
    - Link
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://brapi.dev
  description: Servidor principal da API brapi
- url: http://localhost:3001
  description: Servidor local para desenvolvimento
tags:
- name: Fundos
  description: Descubra e consulte fundos brasileiros listados e estruturados, incluindo FIIs, FIAGROs, FI-Infra/FIFs, FIDCs e FIPs.
paths:
  /api/v2/funds/list:
    get:
      tags:
      - Fundos
      operationId: listFunds
      security:
      - Bearer: []
      summary: Lista de fundos
      description: 'Lista fundos brasileiros com dados disponíveis: FII, FIAGRO, FI-Infra, FIF, FIDC, FIP e outros. Cada item traz ticker, CNPJ, tipo, classificações, administrador, gestor e os últimos indicadores disponíveis.


        A lista ainda não inclui ETFs. Consulte suas cotações e preços históricos nos endpoints de ações. A presença no catálogo de tickers não garante indicadores de fundos.


        `updatedAt` informa a atualização do cadastro. Consulte `asOfDate` em `/api/v2/funds/indicators` para a data dos indicadores. Os indicadores não têm a mesma frequência das cotações.


        Use para descobrir o tipo de um fundo, achar um CNPJ ou filtrar fundos por tipo.


        Busque por `symbols`, `cnpjs` ou `search`. O `search` procura no ticker, no nome, na razão social, no ISIN e no CNPJ.


        Os tipos `fiinfra` e `fiagro` equivalem a `fi-infra` e `fi-agro` no catálogo de tickers.


        Nem todo ticker terminado em 11 é FII. `JURO11` é FI-Infra e não responde nos endpoints de FIIs.


        `sortBy` aceita `symbol`, `name`, `assetType`, `price`, `navPerShare`, `priceToNav`, `totalInvestors` e `updatedAt`. O padrão é `updatedAt`.


        Plano Pro.'
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula, até 20. Ex.: JURO11,XPCA11.'
          example: JURO11
        required: false
        example: JURO11
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs separados por vírgula, até 20, com ou sem pontuação.
          example: '42730834000100'
        required: false
        example: '42730834000100'
        name: cnpjs
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
          description: Número da página, a partir de 1.
          example: 1
        required: false
        example: 1
        name: page
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 20
          description: Itens por página.
          example: 20
        required: false
        example: 20
        name: limit
        in: query
      - schema:
          type: string
          description: Campo usado na ordenação.
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Ordem crescente (`asc`) ou decrescente (`desc`).
          example: desc
        required: false
        example: desc
        name: sortOrder
        in: query
      - schema:
          type: string
          description: Texto buscado no ticker, nome, razão social, ISIN ou CNPJ.
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - fii
          - fiagro
          - fiinfra
          - fif
          - fidc
          - fip
          - etf
          - other
          description: Tipo do fundo.
        required: false
        name: assetType
        in: query
      - schema:
          type: string
          description: Situação do fundo no cadastro.
        required: false
        name: status
        in: query
      responses:
        '200':
          description: Fundos encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  funds:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundListItem'
                  pagination:
                    $ref: '#/components/schemas/FundPaginationMeta'
                  requestedAt:
                    type: string
                    format: date-time
                    description: Data e hora da requisição em ISO 8601.
                    example: '2025-01-24T17:32:38.000Z'
                  took:
                    type: integer
                    minimum: 0
                    description: Tempo de processamento, em milissegundos.
                    example: 45
                required:
                - funds
                - pagination
                - requestedAt
                - took
              example:
                funds:
                - symbol: JURO11
                  cnpj: '42730834000100'
                  formattedCnpj: 42.730.834/0001-00
                  name: SPARTA INFRA
                  legalName: SPARTA INFRA FIC FI INFRA RENDA FIXA CP
                  assetType: fiinfra
                  cvmClassType: null
                  cvmClassification: null
                  anbimaClassification: null
                  b3Classification: Financeiro/Fundos/FI-INFRA
                  isin: null
                  administratorName: null
                  administratorCnpj: null
                  managerName: null
                  managerCnpj: null
                  status: null
                  price: 96.99
                  navPerShare: 99.19945
                  priceToNav: 0.9777272
                  equity: 2040699000
                  totalAssets: 2041704100
                  totalInvestors: 92710
                  updatedAt: '2026-06-21T21:06:37.434Z'
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
                requestedAt: '2026-06-22T02:10:56.319Z'
                took: 902
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/funds/indicators:
    get:
      tags:
      - Fundos
      operationId: getFundIndicators
      security:
      - Bearer: []
      summary: Indicadores de fundos
      description: 'Indicadores mais recentes de um ou mais fundos: preço de mercado, valor patrimonial por cota (`navPerShare`), a razão entre os dois, patrimônio, ativos e número de cotistas.


        Use para comparar preço e valor patrimonial, medir ágio ou deságio e ver o tamanho do fundo.


        Informe `symbols` ou `cnpjs`. Se você não tem o identificador, use a lista de fundos.


        Plano Pro.'
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula, até 20. Ex.: JURO11,XPCA11.'
          example: JURO11
        required: false
        example: JURO11
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs separados por vírgula, até 20, com ou sem pontuação.
          example: '42730834000100'
        required: false
        example: '42730834000100'
        name: cnpjs
        in: query
      - schema:
          type: string
          enum:
          - fii
          - fiagro
          - fiinfra
          - fif
          - fidc
          - fip
          - etf
          - other
          description: Tipo do fundo.
        required: false
        name: assetType
        in: query
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  funds:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundIndicator'
                  requestedAt:
                    type: string
                    format: date-time
                    description: Data e hora da requisição em ISO 8601.
                    example: '2025-01-24T17:32:38.000Z'
                  took:
                    type: integer
                    minimum: 0
                    description: Tempo de processamento, em milissegundos.
                    example: 45
                required:
                - funds
                - requestedAt
                - took
              example:
                funds:
                - symbol: JURO11
                  cnpj: '42730834000100'
                  name: SPARTA INFRA
                  assetType: fiinfra
                  asOfDate: '2026-06-18T00:00:00.000Z'
                  price: 96.99
                  navPerShare: 99.19945
                  priceToNav: 0.9777272
                  equity: 2040699000
                  totalAssets: 2041704100
                  totalInvestors: 92710
                  dailyApplications: 0
                  dailyRedemptions: 0
                  sharesOutstanding: null
                  monthlyReturn: null
                  patrimonialMonthlyReturn: null
                  dividendYieldMonthly: null
                requestedAt: '2026-06-22T02:10:56.524Z'
                took: 189
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
