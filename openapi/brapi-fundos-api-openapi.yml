  /api/v2/funds/profile:
    get:
      tags:
      - Fundos
      operationId: getFundProfile
      security:
      - Bearer: []
      summary: Perfil mensal de fundos
      description: 'Perfil mensal de fundos FI e FIF, conforme a CVM: distribuição de cotistas, medidas de risco, liquidez, concentração e exposição a crédito privado.


        Use para ver se o fundo é de varejo ou institucional e quanto do patrimônio está em ativos de baixa liquidez.


        Informe `symbols` ou `cnpjs`. Sem filtro de data, a resposta traz o perfil mais recente de cada fundo.


        Plano Pro.'
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula, até 20. Ex.: JURO11,XPCA11.'
          example: JURO11
        required: false
        example: JURO11
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs separados por vírgula, até 20, com ou sem pontuação.
          example: '42730834000100'
        required: false
        example: '42730834000100'
        name: cnpjs
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2026-01-01'
        required: false
        example: '2026-01-01'
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD.
          example: '2026-06-30'
        required: false
        example: '2026-06-30'
        name: endDate
        in: query
      - schema:
          type: string
          description: Mês de referência no formato YYYY-MM-DD.
        required: false
        name: referenceDate
        in: query
      - schema:
          type: string
        required: false
        name: include
        in: query
      responses:
        '200':
          description: Perfis
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundProfile'
                  requestedAt:
                    type: string
                    format: date-time
                    description: Data e hora da requisição em ISO 8601.
                    example: '2025-01-24T17:32:38.000Z'
                  took:
                    type: integer
                    minimum: 0
                    description: Tempo de processamento, em milissegundos.
                    example: 45
                required:
                - profiles
                - requestedAt
                - took
              example:
                profiles:
                - symbol: JURO11
                  cnpj: '42730834000100'
                  referenceDate: '2026-05-31T00:00:00.000Z'
                  investorBreakdown:
                    other: 0
                    fundsOrClubs: 1
                    nonResidents: 0
                    otherPercent: 0
                    legalEntities: 0
                    individualRetail: 0
                    fundsOrClubsPercent: 100
                    nonResidentsPercent: 0
                    legalEntitiesPercent: 0
                    individualRetailPercent: 0
                  risk:
                    riskModel: Modelos Não-Paramétricos
                    portfolioVar: 0
                    dailyQuotaVariationPercent: 0
                    privateCreditExposurePercent: 0
                    stressedDailyQuotaVariationPercent: 0
                  liquidity: null
                  concentration:
                    topCotistaPercent: 0
                  privateCredit:
                    exposurePercent: 0
                requestedAt: '2026-06-22T02:10:56.983Z'
                took: 152
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
