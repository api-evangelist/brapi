                - took
              example:
                history:
                - symbol: JURO11
                  cnpj: '42730834000100'
                  date: '2026-06-18T00:00:00.000Z'
                  classOrSeries: null
                  totalAssets: 2041704100
                  navPerShare: 99.19945
                  equity: 2040699000
                  dailyApplications: 0
                  dailyRedemptions: 0
                  totalInvestors: 92710
                  monthlyReturn: null
                - symbol: JURO11
                  cnpj: '42730834000100'
                  date: '2026-06-17T00:00:00.000Z'
                  classOrSeries: null
                  totalAssets: 2044940400
                  navPerShare: 99.36075
                  equity: 2044017200
                  dailyApplications: 0
                  dailyRedemptions: 0
                  totalInvestors: 92779
                  monthlyReturn: null
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 114
                  totalPages: 6
                  hasNextPage: true
                requestedAt: '2026-06-22T02:10:56.827Z'
                took: 300
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
          content:
