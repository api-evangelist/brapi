              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/funds/dividends:
    get:
      tags:
      - Fundos
      operationId: getFundDividends
      security:
      - Bearer: []
      summary: Dividendos de fundos
      description: 'Dividendos e rendimentos de FIAGRO, FI-Infra, FIF, FIDC e FIP listados. Cada evento traz data de declaração, data-com (`lastDatePrior`), data ex quando existe, data de pagamento, valor por cota e rótulo.


        Use para calcular renda, montar calendários de pagamento e comparar rendimentos.


        Os filtros `startDate` e `endDate` usam `paymentDate`. Sem `symbols` e `cnpjs`, a resposta traz todos os fundos.


        FIIs ficam em dividendos de FIIs. Um ticker de FII neste endpoint retorna erro 400.


        O histórico começa no primeiro evento verificável de cada fundo. Não há data inicial única. As fontes são documentos da CVM e comunicados de administradores e gestores. Eventos de tickers antigos continuam depois de um renome. A brapi não estima datas de pagamento. A revisão é mensal.


        Plano Pro.'
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula, até 20. Ex.: JURO11,XPCA11.'
          example: JURO11
        required: false
        example: JURO11
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs separados por vírgula, até 20, com ou sem pontuação.
          example: '42730834000100'
        required: false
        example: '42730834000100'
        name: cnpjs
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2026-01-01'
        required: false
        example: '2026-01-01'
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD.
          example: '2026-06-30'
        required: false
        example: '2026-06-30'
        name: endDate
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
          description: Número da página, a partir de 1.
          example: 1
        required: false
        example: 1
        name: page
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 20
          description: Itens por página.
          example: 20
        required: false
        example: 20
        name: limit
        in: query
      - schema:
          type: string
