  /api/v2/funds/fip/reports:
    get:
      tags:
      - Fundos
      operationId: getFipReports
      security:
      - Bearer: []
      summary: Relatórios de FIP
      description: 'Relatórios trimestrais e quadrimestrais de FIP na CVM: patrimônio, capital comprometido e integralizado, cotas, classe e composição de investidores.


        Use para acompanhar o capital e os investidores de um FIP.


        Escolha o documento com `reportType`. Informe `cnpjs`, ou `symbols` quando o fundo tem ticker. FIP não tem cota diária.


        `sortBy` aceita `referenceDate`, `cnpj` e `netEquity`. O padrão é `referenceDate`.


        Plano Pro.'
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula, até 20. Ex.: JURO11,XPCA11.'
        required: false
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs separados por vírgula, até 20, com ou sem pontuação.
          example: '06033235000166'
        required: false
        example: '06033235000166'
        name: cnpjs
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2026-01-01'
        required: false
        example: '2026-01-01'
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD.
          example: '2026-06-30'
        required: false
        example: '2026-06-30'
        name: endDate
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
          description: Número da página, a partir de 1.
          example: 1
        required: false
        example: 1
        name: page
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 20
          description: Itens por página.
          example: 20
        required: false
        example: 20
        name: limit
        in: query
      - schema:
          type: string
          description: Campo usado na ordenação.
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Ordem crescente (`asc`) ou decrescente (`desc`).
          example: desc
        required: false
        example: desc
        name: sortOrder
        in: query
      - schema:
          type: string
          enum:
          - trimestral
          - quadrimestral
          description: Tipo de relatório.
        required: false
        name: reportType
        in: query
      responses:
        '200':
          description: Relatórios FIP
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/FipReport'
                  pagination:
                    $ref: '#/components/schemas/FundPaginationMeta'
                  requestedAt:
                    type: string
                    format: date-time
                    description: Data e hora da requisição em ISO 8601.
                    example: '2025-01-24T17:32:38.000Z'
                  took:
                    type: integer
                    minimum: 0
                    description: Tempo de processamento, em milissegundos.
                    example: 45
                required:
                - reports
                - pagination
                - requestedAt
                - took
