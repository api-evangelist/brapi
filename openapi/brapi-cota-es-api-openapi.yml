openapi: 3.2.0
info:
  title: brapi - API do Mercado Financeiro Brasileiro Cotações API
  version: 3.0.0
  description: 'Dados do mercado financeiro brasileiro: ações, FIIs, fundos, BDRs, ETFs, índices, opções, futuros, Tesouro Direto, câmbio, criptomoedas e séries macroeconômicas.


    Envie a chave no header `Authorization: Bearer `. Crie a conta em https://brapi.dev/login e pegue a chave em https://brapi.dev/dashboard. PETR4, MGLU3, VALE3 e ITUB4 funcionam sem chave.


    Use as rotas em `/api/v2` em integrações novas. Uma rota descontinuada envia `Deprecation: true`, `Sunset: ` e um header `Link` com a rota que a substitui. A política está em https://brapi.dev/docs/versioning.


    SDKs oficiais: `npm install brapi` (https://github.com/brapi-dev/brapi-typescript) e `pip install brapi` (https://github.com/brapi-dev/brapi-python). Documentação: https://brapi.dev/docs'
  contact:
    name: brapi
    url: https://brapi.dev
    email: contato@brapi.dev
  externalDocs:
    description: Política de versionamento e descontinuação
    url: https://brapi.dev/versioning.md
  x-brapi-versioning:
    strategy: url
    currentVersion: v2
    policyUrl: https://brapi.dev/versioning.md
    deprecationHeaders:
    - Deprecation
    - Sunset
    - Link
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://brapi.dev
  description: Servidor principal da API brapi
- url: http://localhost:3001
  description: Servidor local para desenvolvimento
tags:
- name: Cotações
  description: Consulte informações detalhadas sobre ações, BDRs, ETFs e índices brasileiros. Obtenha preços em tempo real, dados fundamentalistas, históricos e dividendos.
paths:
  /api/quote/list:
    get:
      tags:
      - Cotações
      operationId: getQuoteList
      summary: Listar ativos
      description: 'Lista de ações, FIIs, BDRs e ETFs com preço de fechamento, variação, volume, market cap, setor e logo de cada um. A resposta também traz os índices disponíveis.


        Use para screeners, tabelas de mercado e busca de ativos com cotação.


        `search` busca por parte do ticker ou do nome da empresa. Filtre por `type`, `subType`, `sector` e `subsector`. A ordem padrão é por volume, decrescente.


        Sem `limit`, a resposta traz até 2.000 ativos e não traz os campos de paginação. Com `limit`, ela traz `currentPage`, `totalPages`, `itemsPerPage`, `totalCount` e `hasNextPage`.


        `availableSectors`, `availableSubsectors`, `availableStockTypes` e `availableSubTypeTypes` listam os valores aceitos nos filtros.


        Este endpoint não exige token. Para buscar e validar tickers, a lista de tickers traz uma resposta menor.'
      parameters:
      - schema:
          type: string
          description: Parte do ticker ou do nome da empresa.
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - name
          - close
          - change
          - change_abs
          - volume
          - market_cap_basic
          description: 'Campo de ordenação. Padrão: volume.'
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          description: 'Ordem. Padrão: desc.'
        required: false
        name: sortOrder
        in: query
      - schema:
          type: string
          description: 'Itens por página. Máximo: 2000. Sem este parâmetro, a resposta traz até 2000 itens e não traz paginação.'
        required: false
        name: limit
        in: query
      - schema:
          type: string
          description: Número da página. Começa em 1.
        required: false
        name: page
        in: query
      - schema:
          type: string
          description: Setor.
        required: false
        name: sector
        in: query
      - schema:
          type: string
          description: Subsetor.
        required: false
        name: subsector
        in: query
      - schema:
          type: string
          enum:
          - stock
          - fund
          - bdr
          description: Tipo do ativo.
        required: false
        name: type
        in: query
      - schema:
          type: string
          enum:
          - stock
          - unit
          - fii
          - etf
          - fi-infra
          - fi-agro
          - fip
          - fidc
          - bdr
          description: 'Subtipo do ativo: stock, unit, fii, etf, fi-infra, fi-agro, fip, fidc ou bdr.'
        required: false
        name: subType
        in: query
      - schema:
          type: string
          description: Token de acesso. Use no lugar do header `Authorization`.
        required: false
        name: token
        in: query
      responses:
        '200':
          description: Lista de ativos retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListResponse'
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/quote/{tickers}:
    get:
      tags:
      - Cotações
      operationId: getQuote
      summary: Cotação de ativos (v1)
      description: 'Cotação de um ou mais ativos brasileiros. A mesma resposta pode trazer histórico de preços, proventos e dados das demonstrações financeiras.


        Use para integrações que já usam este formato. Para integrações novas, use os endpoints `/api/v2/stocks/*`, que trazem um tipo de dado por chamada. Veja o guia de migração.


        Este é o endpoint original da brapi. Ele continua ativo e não tem data de remoção.


        AXIA5 e AXIA6 retornam a cotação de uma ação AXIA3. Seus preços históricos e proventos continuam separados por classe. Os campos `historicalSymbol` e `dividendsSymbol` identificam o ticker desses históricos.


        A resposta sempre traz a cotação: preço, variação, volume, máxima e mínima do dia, faixa de 52 semanas e `marketCap`. Estes parâmetros adicionam outros dados:


        - `range` e `interval`, ou `startDate` e `endDate`: `historicalDataPrice`, a série de preços.

        - `includeRaw=true`: os preços originais sem ajuste `rawOpen`, `rawHigh`, `rawLow` e `rawClose`, só em intervalos diários. Exige o plano Pro.

        - `dividends=true`: `dividendsData`, com dividendos, JCP e eventos em ações.

        - `modules`: um objeto para cada módulo pedido.


        Módulos aceitos em `modules`, separados por vírgula:


        - `summaryProfile`: cadastro da empresa.

        - `defaultKeyStatistics`: múltiplos dos últimos 12 meses, como P/L, P/VP e dividend yield.

        - `financialData`: receita, EBITDA, margens e dívida dos últimos 12 meses.

        - `balanceSheetHistory`: balanço patrimonial anual.

        - `incomeStatementHistory`: DRE anual.

        - `cashflowHistory`: fluxo de caixa anual.

        - `valueAddedHistory`: DVA anual.


        Cada módulo de demonstração tem uma versão trimestral com o sufixo `Quarterly`, como `balanceSheetHistoryQuarterly`. `defaultKeyStatistics` e `financialData` também aceitam os sufixos `History` e `HistoryQuarterly`. Os dados trimestrais seguem as mesmas regras dos endpoints v2 de DRE, fluxo de caixa e DVA.


        O plano define os valores aceitos em `range`, `interval` e `modules`. Um valor fora do plano retorna erro.


        PETR4, MGLU3, VALE3 e ITUB4 respondem sem token. Se a chamada juntar um deles com outro ticker, ela exige token.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers separados por vírgula. Ex.: PETR4,VALE3.'
          example: PETR4,VALE3
        required: true
        name: tickers
        in: path
      - schema:
          type: string
          enum:
          - 1d
          - 2d
          - 5d
          - 7d
          - 1mo
          - 3mo
          - 6mo
          - 1y
          - 2y
          - 5y
          - 10y
          - ytd
          - max
          description: Janela relativa da série de preços.
        required: false
        name: range
        in: query
      - schema:
          type: string
          enum:
          - 1m
          - 2m
          - 5m
          - 15m
          - 30m
          - 60m
          - 90m
          - 1h
          - 1d
          - 5d
          - 1wk
          - 1mo
          - 3mo
          description: Intervalo entre os pontos da série de preços.
        required: false
        name: interval
        in: query
      - schema:
          type: string
          description: Data inicial da série de preços no formato YYYY-MM-DD.
          example: '2024-01-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final da série de preços no formato YYYY-MM-DD. Sem `startDate`, `range` conta para trás a partir desta data.
          example: '2024-12-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Inclui `dividendsData` com dividendos, JCP e eventos em ações.
        required: false
        name: dividends
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Inclui os preços originais sem ajuste (`rawOpen`, `rawHigh`, `rawLow`, `rawClose`) em intervalos diários. Exige o plano Pro.
          example: 'true'
        required: false
        name: includeRaw
        in: query
      - schema:
          type: string
          description: Módulos extras separados por vírgula.
          example: summaryProfile,balanceSheetHistory,financialData
        required: false
        name: modules
        in: query
      - schema:
          type: string
          description: Token de acesso. Use no lugar do header `Authorization`.
        required: false
        name: token
        in: query
      responses:
        '200':
          description: Dados dos ativos recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteTickersResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '429':
          description: Limite de requisições excedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Limite de requisições excedido.
                  example:
                    error: true
                    message: Limite de requisições excedido. Tente novamente mais tarde.
                    code: RATE_LIMIT_EXCEEDED
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SummaryProfile:
      type: object
      properties:
        symbol:
          type: string
          description: Ticker do ativo
        cnpj:
          type: string
          nullable: true
          description: CNPJ da empresa
        address1:
          type: string
          nullable: true
          description: Endereço linha 1
        address2:
          type: string
          nullable: true
          description: Endereço linha 2
        address3:
          type: string
          nullable: true
          description: Endereço linha 3
        city:
          type: string
          nullable: true
          description: Cidade
        state:
          type: string
          nullable: true
          description: Estado
        zip:
          type: string
          nullable: true
          description: CEP
        country:
          type: string
          nullable: true
          description: País
        phone:
          type: string
          nullable: true
          description: Telefone
        fax:
          type: string
          nullable: true
          description: Fax
        website:
          type: string
          nullable: true
          description: Website
        industry:
          type: string
          nullable: true
          description: Setor
        industryKey:
          type: string
          nullable: true
          description: Chave do setor
        industryDisp:
          type: string
          nullable: true
          description: Nome do setor
        sector:
          type: string
          nullable: true
          description: Segmento
        sectorKey:
          type: string
          nullable: true
          description: Chave do segmento
        sectorDisp:
          type: string
          nullable: true
          description: Nome do segmento
        longBusinessSummary:
          type: string
          nullable: true
          description: Descrição da empresa
        fullTimeEmployees:
          type: number
          nullable: true
          description: Número de funcionários
        companyOfficers:
          type: array
          items:
            nullable: true
          description: Diretoria
        updatedAt:
          type: string
          nullable: true
          description: Data de atualização
      required:
      - symbol
      - cnpj
      - address1
      - address2
      - address3
      - city
      - state
      - zip
      - country
      - phone
      - fax
      - website
      - industry
      - industryKey
      - industryDisp
      - sector
      - sectorKey
      - sectorDisp
      - longBusinessSummary
      - fullTimeEmployees
      - companyOfficers
      - updatedAt
      description: Cadastro da empresa. Vem com o módulo `summaryProfile`.
    FinancialDataEntry:
      type: object
      properties:
        symbol:
          type: string
          description: Ticker do ativo
        currentPrice:
          type: number
          nullable: true
          description: Preço atual
        ebitda:
          type: number
          nullable: true
          description: EBITDA
        quickRatio:
          type: number
          nullable: true
          description: Liquidez seca
        currentRatio:
          type: number
          nullable: true
          description: Liquidez corrente
        debtToEquity:
          type: number
          nullable: true
          description: Dívida/PL
        revenuePerShare:
          type: number
          nullable: true
          description: Receita por ação
        returnOnAssets:
          type: number
          nullable: true
          description: ROA
        returnOnEquity:
          type: number
          nullable: true
          description: ROE
        earningsGrowth:
          type: number
          nullable: true
          description: Crescimento do lucro atribuível aos controladores nos últimos 4 trimestres, contra os 4 trimestres anteriores. Para a variação anual, use `earningsGrowthAnnual`.
        revenueGrowth:
          type: number
          nullable: true
          description: Crescimento da receita nos últimos 4 trimestres, contra os 4 trimestres anteriores. Para a variação anual, use `revenueGrowthAnnual`.
        earningsGrowthAnnual:
          type: number
          nullable: true
          description: Crescimento do lucro atribuível aos controladores no último exercício completo, contra o exercício anterior.
        revenueGrowthAnnual:
          type: number
          nullable: true
          description: Crescimento da receita líquida no último exercício completo, contra o exercício anterior.
        grossMargins:
          type: number
          nullable: true
          description: Margem bruta
        ebitdaMargins:
          type: number
          nullable: true
          description: Margem EBITDA
        operatingMargins:
          type: number
          nullable: true
          description: Margem operacional
        profitMargins:
          type: number
          nullable: true
          description: Margem de lucro
        totalCash:
          type: number
          nullable: true
          description: Caixa total
        totalCashPerShare:
          type: number
          nullable: true
          description: Caixa por ação
        totalDebt:
          type: number
          nullable: true
          description: Dívida total
        totalRevenue:
          type: number
          nullable: true
          description: Receita total
        grossProfits:
          type: number
          nullable: true
          description: Lucro bruto
        operatingCashflow:
          type: number
          nullable: true
          description: Fluxo de caixa operacional
        freeCashflow:
          type: number
          nullable: true
          description: Fluxo de caixa livre
        financialCurrency:
          type: string
          nullable: true
          description: Moeda
        updatedAt:
          type: string
          nullable: true
          description: Data de atualização
        type:
          type: string
          nullable: true
          description: Tipo (ttm, yearly, quarterly)
      required:
      - symbol
      - currentPrice
      - ebitda
      - quickRatio
      - currentRatio
      - debtToEquity
      - revenuePerShare
      - returnOnAssets
      - returnOnEquity
      - earningsGrowth
      - revenueGrowth
      - earningsGrowthAnnual
      - revenueGrowthAnnual
      - grossMargins
      - ebitdaMargins
      - operatingMargins
      - profitMargins
      - totalCash
      - totalCashPerShare
      - totalDebt
      - totalRevenue
      - grossProfits
      - operatingCashflow
      - freeCashflow
      - financialCurrency
      - updatedAt
      - type
      description: Dados financeiros dos últimos 12 meses.
    QuoteListResponse:
      type: object
      properties:
        indexes:
          type: array
          items:
            type: object
            properties:
              stock:
                type: string
              name:
                type: string
            required:
            - stock
            - name
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/QuoteListItem'
        availableSectors:
          type: array
          items:
            type: string
        availableSubsectors:
          type: array
          items:
            type: string
        availableStockTypes:
          type: array
          items:
            type: string
        availableSubTypeTypes:
          type: array
          items:
            type: string
        currentPage:
          type: number
        totalPages:
          type: number
        itemsPerPage:
          type: number
        totalCount:
          type: number
        hasNextPage:
          type: boolean
      required:
      - indexes
      - stocks
      - availableSectors
      - availableSubsectors
      - availableStockTypes
      - availableSubTypeTypes
      example:
        indexes:
        - stock: ^BVSP
          name: IBOVESPA
        - stock: IFIX.SA
          name: Índice de Fundos Imobiliários
        stocks:
        - stock: PETR4
          name: PETR4
          close: 36.65
          change: -0.95
          volume: 27681100
          market_cap: 483937892568
          sector: Energy Minerals
          type: stock
          subType: stock
          logo: https://icons.brapi.dev/icons/PETR4.svg
        - stock: VALE3
          name: VALE3
          close: 52.89
          change: -1.23
          volume: 18543200
          market_cap: 229876543210
          sector: Non-Energy Minerals
          type: stock
          subType: stock
          logo: https://icons.brapi.dev/icons/VALE3.svg
        availableSectors:
        - Retail Trade
        - Energy Minerals
        - Health Services
        - Utilities
        - Finance
        - Consumer Services
        - Consumer Non-Durables
        - Non-Energy Minerals
        - Commercial Services
        - Distribution Services
        - Transportation
        - Technology Services
        - Process Industries
        - Communications
        - Producer Manufacturing
        - Miscellaneous
        - Electronic Technology
        - Industrial Services
        - Health Technology
        - Consumer Durables
        availableSubsectors:
        - Comércio
        - Intermediários Financeiros
        availableStockTypes:
        - stock
        - fund
        - bdr
        availableSubTypeTypes:
        - stock
        - unit
        - fii
        - etf
        - fi-infra
        - fi-agro
        - fip
        - fidc
        - bdr
        currentPage: 1
        totalPages: 50
        itemsPerPage: 10
        totalCount: 500
        hasNextPage: true
        requestedAt: '2026-02-08T16:25:29.000Z'
        took: 12
    ErrorResponse:
      type: object
      properties:
        error:
          type: boolean
          enum:
          - true
        message:
          type: string
        code:
          type: string
      required:
      - error
      - message
      description: Erro interno do servidor.
      example:
        error: true
        message: Erro interno do servidor
        code: INTERNAL_SERVER_ERROR
    QuoteResult:
      type: object
      properties:
        symbol:
          type: string
          description: 'Ticker do ativo. Ex.: PETR4, ^BVSP.'
          example: PETR4
        requestedSymbol:
          type: string
          description: Ticker enviado quando a cotação pertence a outro ticker.
          example: AXIA6
        dividendsSymbol:
          type: string
          description: Ticker do histórico de proventos quando ele difere do ticker da cotação.
          example: AXIA6
        historicalSymbol:
          type: string
          description: Ticker do histórico de preços quando ele difere do ticker da cotação.
          example: AXIA6
        currency:
          type: string
          description: Moeda dos valores. Em geral, BRL.
        shortName:
          type: string
          nullable: true
          description: Nome curto do ativo.
        longName:
          type: string
          nullable: true
          description: Nome completo da empresa.
        regularMarketPrice:
          type: number
          nullable: true
          description: Preço do último negócio.
        regularMarketChange:
          type: number
          nullable: true
          description: Variação do preço no dia em relação ao fechamento anterior, em reais.
        regularMarketChangePercent:
          type: number
          nullable: true
          description: Variação do preço no dia, em porcentagem.
        regularMarketTime:
          type: string
          nullable: true
          description: Horário da cotação em ISO 8601.
        regularMarketDayHigh:
          type: number
          nullable: true
          description: Preço máximo do dia.
        regularMarketDayLow:
          type: number
          nullable: true
          description: Preço mínimo do dia.
        regularMarketDayRange:
          type: string
          nullable: true
          description: Faixa de preço do dia no formato mínimo - máximo.
        regularMarketVolume:
          type: number
          nullable: true
          description: Volume negociado no dia.
        regularMarketPreviousClose:
          type: number
          nullable: true
          description: Fechamento do pregão anterior.
        regularMarketOpen:
          type: number
          nullable: true
          description: Preço de abertura do dia.
        averageDailyVolume3Month:
          type: number
          nullable: true
          description: Volume médio diário dos últimos 3 meses.
        averageDailyVolume10Day:
          type: number
          nullable: true
          description: Volume médio diário dos últimos 10 dias.
        fiftyTwoWeekLow:
          type: number
          nullable: true
          description: Preço mínimo das últimas 52 semanas.
        fiftyTwoWeekHigh:
          type: number
          nullable: true
          description: Preço máximo das últimas 52 semanas.
        fiftyTwoWeekRange:
          type: string
          nullable: true
          description: Faixa de preço das últimas 52 semanas no formato mínimo - máximo.
        fiftyTwoWeekLowChange:
          type: number
          nullable: true
          description: Diferença entre o preço atual e o mínimo de 52 semanas.
        fiftyTwoWeekHighChange:
          type: number
          nullable: true
          description: Diferença entre o preço atual e o máximo de 52 semanas.
        fiftyTwoWeekHighChangePercent:
          type: number
          nullable: true
          description: Diferença entre o preço atual e o máximo de 52 semanas, em porcentagem.
        twoHundredDayAverage:
          type: number
          nullable: true
          description: Média móvel de 200 dias.
        twoHundredDayAverageChange:
          type: number
          nullable: true
          description: Diferença entre o preço atual e a média de 200 dias.
        twoHundredDayAverageChangePercent:
          type: number
          nullable: true
