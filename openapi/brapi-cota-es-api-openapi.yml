    DividendsData:
      type: object
      properties:
        cashDividends:
          type: array
          items:
            type: object
            properties:
              assetIssued:
                type: string
                description: Código ISIN do ativo que dá direito ao provento.
              paymentDate:
                type: string
                nullable: true
                description: Data de pagamento.
              paymentDateIsDeadline:
                type: boolean
                description: '`true` quando a empresa informou só o prazo máximo do pagamento ("até 31/12/2026"). Nesse caso, `paymentDate` é o prazo e muda quando a empresa divulgar a data.'
              verified:
                type: boolean
                description: '`true` quando o provento foi conferido em um documento publicado pela empresa ou pelo fundo. `false` quando vem de dados históricos que ainda não têm esse documento.'
              rate:
                type: number
                description: Valor por ação, em reais.
              rawRate:
                type: number
                nullable: true
                description: Valor por ação na escala dos preços sem ajuste. Vem com `includeRaw=true`.
              relatedTo:
                type: string
                description: 'Período a que o provento se refere. Ex.: 1º Trimestre/2024.'
              approvedOn:
                type: string
                nullable: true
                description: Data de aprovação.
              isinCode:
                type: string
                description: Código ISIN.
              label:
                type: string
                description: 'Tipo do provento: DIVIDENDO ou JCP.'
              lastDatePrior:
                type: string
                nullable: true
                description: Data-com, o último dia para comprar o ativo e ter direito ao provento.
              exDate:
                type: string
                nullable: true
                description: Data ex, o primeiro dia sem direito ao provento. Pode ser nulo.
              remarks:
                type: string
                description: Observações.
            required:
            - assetIssued
            - paymentDate
            - paymentDateIsDeadline
            - verified
            - rate
            - relatedTo
            - approvedOn
            - isinCode
            - label
            - lastDatePrior
            - exDate
            - remarks
          description: Dividendos e JCP pagos em dinheiro.
        stockDividends:
          type: array
          items:
            type: object
            properties:
              assetIssued:
                type: string
                description: Código ISIN do ativo que dá direito ao provento.
              factor:
                type: number
                description: 'Fator do evento. Ex.: 2 em um desdobramento de 2 para 1.'
              completeFactor:
                type: string
                description: 'Fator em texto. Ex.: 2 para 1.'
              approvedOn:
                type: string
                nullable: true
                description: Data de aprovação.
              isinCode:
                type: string
                description: Código ISIN.
              label:
                type: string
                description: 'Tipo do evento: DESDOBRAMENTO, GRUPAMENTO ou BONIFICAÇÃO.'
              lastDatePrior:
                type: string
                nullable: true
                description: Data-com, o último dia para comprar o ativo e ter direito ao evento.
              exDate:
                type: string
                nullable: true
                description: Data ex, o primeiro dia sem direito ao evento. Pode ser nulo.
              remarks:
                type: string
                description: Observações.
            required:
            - assetIssued
            - factor
            - completeFactor
            - approvedOn
            - isinCode
            - label
            - lastDatePrior
            - exDate
            - remarks
          description: 'Eventos em ações: desdobramentos, grupamentos e bonificações.'
        subscriptions:
          type: array
          items:
            nullable: true
          description: Direitos de subscrição.
      required:
      - cashDividends
      - stockDividends
      - subscriptions
      description: Proventos. Na rota `/api/quote/{tickers}`, vem com `dividends=true`. Na rota `/api/v2/stocks/dividends`, não exige esse parâmetro.
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de API obtido no dashboard em brapi.dev/dashboard
