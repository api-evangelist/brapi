openapi: 3.2.0
info:
  title: brapi - API do Mercado Financeiro Brasileiro Fundos…
  version: 3.0.0
  description: 'Dados do mercado financeiro brasileiro: ações, FIIs, fundos, BDRs, ETFs, índices, opções, futuros, Tesouro Direto, câmbio, criptomoedas e séries macroeconômicas.


    Envie a chave no header `Authorization: Bearer `. Crie a conta em https://brapi.dev/login e pegue a chave em https://brapi.dev/dashboard. PETR4, MGLU3, VALE3 e ITUB4 funcionam sem chave.


    Use as rotas em `/api/v2` em integrações novas. Uma rota descontinuada envia `Deprecation: true`, `Sunset: ` e um header `Link` com a rota que a substitui. A política está em https://brapi.dev/docs/versioning.


    SDKs oficiais: `npm install brapi` (https://github.com/brapi-dev/brapi-typescript) e `pip install brapi` (https://github.com/brapi-dev/brapi-python). Documentação: https://brapi.dev/docs'
  contact:
    name: brapi
    url: https://brapi.dev
    email: contato@brapi.dev
  externalDocs:
    description: Política de versionamento e descontinuação
    url: https://brapi.dev/versioning.md
  x-brapi-versioning:
    strategy: url
    currentVersion: v2
    policyUrl: https://brapi.dev/versioning.md
    deprecationHeaders:
    - Deprecation
    - Sunset
    - Link
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://brapi.dev
  description: Servidor principal da API brapi
- url: http://localhost:3001
  description: Servidor local para desenvolvimento
tags:
- name: Fundos Imobiliários
  description: 'Acesse dados completos de FIIs: cotações, indicadores fundamentalistas (P/VP, DY), relatórios gerenciais e histórico de proventos.'
paths:
  /api/v2/fii/list:
    get:
      tags:
      - Fundos Imobiliários
      operationId: listFii
      summary: Listar FIIs
      description: 'Lista paginada de FIIs com dados cadastrais, dados do administrador e indicadores atuais: preço, valor patrimonial por cota, P/VP, dividend yield de 12 meses e total de cotistas.


        Use para montar um screener, filtrar fundos por segmento ou achar o ticker de um CNPJ.


        `search` busca no nome, no ticker e no CNPJ. `segmentoAtuacao` aceita valores como Logística, Shoppings, Escritórios, Lajes Corporativas, Títulos e Val. Mob., Residencial, Hospital, Hotel, Educacional, Híbrido, Multicategoria, Varejo e Outros.


        `sortBy` aceita `symbol`, `name`, `segmentoAtuacao`, `mandate`, `price`, `navPerShare`, `priceToNav`, `dividendYield12m` e `totalInvestors`. O padrão é `totalInvestors`.


        Nem todo ticker terminado em 11 é FII. FI-Infra (como JURO11), FIAGRO, FIDC e FIP ficam em fundos.


        Plano Pro. Sem token, aceita só `symbols` ou `cnpjs` de MXRF11 e HGLG11.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 1
          description: Número da página, a partir de 1.
          example: 1
        required: false
        name: page
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          default: 20
          description: Itens por página. Não há limite máximo.
          example: 20
        required: false
        name: limit
        in: query
      - schema:
          type: string
          description: Campo de ordenação.
          example: referenceDate
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Direção da ordenação.
          example: desc
        required: false
        name: sortOrder
        in: query
      - schema:
          type: string
          description: Tickers de FIIs separados por vírgula, até 20.
          example: HGLG11,MXRF11
        required: false
        name: symbols
        in: query
      - schema:
          type: string
          description: CNPJs de FIIs separados por vírgula, até 20. Aceita com ou sem pontuação.
          example: '11728688000147'
        required: false
        name: cnpjs
        in: query
      - schema:
          type: string
          description: Texto buscado no nome, no ticker ou no CNPJ.
          example: hglg
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - papel
          - tijolo
          - hibrido
          - fof
          description: 'Tipo do fundo: papel, tijolo, hibrido ou fof.'
        required: false
        name: segmentType
        in: query
      - schema:
          type: string
          description: 'Setor de atuação. Ex.: Logística, Shoppings, Escritórios.'
        required: false
        name: segmentoAtuacao
        in: query
      - schema:
          type: string
          description: 'Mandato do fundo. Ex.: Renda, Híbrido, Títulos e Valores Mobiliários.'
        required: false
        name: mandate
        in: query
      - schema:
          type: string
          description: 'Tipo de gestão: Ativa ou Definida.'
        required: false
        name: tipoGestao
        in: query
      responses:
        '200':
          description: Lista paginada de FIIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiiListResponse'
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/fii/indicators:
    get:
      tags:
      - Fundos Imobiliários
      operationId: getFiiIndicators
      summary: Indicadores de FIIs
      description: 'Indicadores mais recentes de um ou mais FIIs: preço, valor patrimonial por cota, P/VP, dividend yield de 1 e 12 meses, retorno mensal, cotistas, cotas emitidas, patrimônio líquido, ativo total, segmento e dados do administrador.


        Use para comparar FIIs, mostrar o P/VP e o yield de uma cota, ou montar a ficha de um fundo.


        `priceToNav` abaixo de 1 indica que a cota negocia abaixo do valor patrimonial.


        Para a série mensal, use o histórico de indicadores.


        Plano Pro. Sem token, aceita só `symbols` com MXRF11 e HGLG11.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers de FIIs separados por vírgula, até 20. Ex.: HGLG11,MXRF11.'
          example: HGLG11,MXRF11
        required: true
        name: symbols
        in: query
      responses:
        '200':
          description: Indicadores atuais dos FIIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiiIndicatorsResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/fii/indicators/history:
    get:
      tags:
      - Fundos Imobiliários
      operationId: getFiiIndicatorsHistory
      summary: Histórico de indicadores de FIIs
      description: 'Série mensal dos indicadores de FIIs: um ponto por mês, com `referenceDate` no último dia do mês. O histórico começa em setembro de 2016.


        Use para gráficos de P/VP e dividend yield, e para comparar um fundo com o próprio passado.


        Sem `startDate` e `endDate`, retorna os últimos 12 meses. `sortBy` aceita `referenceDate` (padrão), `symbol`, `price`, `navPerShare`, `priceToNav`, `dividendYield12m`, `dividendYield1m`, `monthlyReturn` e `totalInvestors`.


        Plano Pro. Sem token, aceita só `symbols` com MXRF11 e HGLG11.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers de FIIs separados por vírgula, até 20. Ex.: HGLG11,MXRF11.'
          example: HGLG11,MXRF11
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2024-01-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD.
          example: '2025-12-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          description: Campo de ordenação.
          example: referenceDate
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Direção da ordenação.
          example: desc
        required: false
        name: sortOrder
        in: query
      responses:
        '200':
          description: Série mensal de indicadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiiIndicatorsHistoryResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/fii/historical:
    get:
      tags:
      - Fundos Imobiliários
      operationId: getFiiHistoricalPrice
      summary: Histórico de preços de FIIs
      description: 'Série diária de preços das cotas de FIIs: `open`, `high`, `low`, `close`, `volume` e `adjustedClose`, em reais. `date` é um timestamp UNIX em segundos.


        Use para gráficos de preço, cálculo de retorno e backtests.


        Use `adjustedClose` para calcular retorno. Ele considera desdobramentos e proventos. `close` não.


        Sem `startDate` e `endDate`, retorna os últimos 12 meses. Cada símbolo tem a própria série em `historicalDataPrice`.


        Plano Pro. Sem token, aceita só `symbols` com MXRF11 e HGLG11.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers de FIIs separados por vírgula, até 20. Ex.: HGLG11,MXRF11.'
          example: HGLG11,MXRF11
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          description: Data inicial no formato YYYY-MM-DD.
          example: '2024-01-01'
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          description: Data final no formato YYYY-MM-DD.
          example: '2025-12-31'
        required: false
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Direção da ordenação por data.
          example: desc
        required: false
        name: sortOrder
        in: query
      responses:
        '200':
          description: Série diária de preços por FII.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiiHistoricalResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/fii/portfolio:
    get:
      tags:
      - Fundos Imobiliários
      operationId: getFiiPortfolio
      summary: Carteira de FIIs
      description: 'Composição da carteira de FIIs pelo informe trimestral da CVM: imóveis, CRIs e outros ativos financeiros, cotas de outros FIIs, terrenos e direitos, com totais em `summary`.


        Use para analisar FIIs de papel e fundos de fundos, ver os CRIs de um fundo ou somar a exposição por classe de ativo.


        `include` escolhe as listas. Sem `include`, retorna todas. `summary` sempre vem.


        Em fundos de fundos, `fundHoldings` lista as cotas de outros FIIs. Em FIIs de papel, `financialAssets` lista os CRIs com emissor e valor. `allocations` resume a carteira por classe de ativo.


        Sem `referenceDate`, retorna o trimestre mais recente de cada fundo. Informes podem ser retificados. O padrão retorna a versão mais recente, e `allVersions=true` retorna todas.


        Para imóveis e vacância, use imóveis de FIIs. Para a série no tempo, use o histórico da carteira.


        Plano Pro. Sem token, aceita só `symbols` com MXRF11 e HGLG11.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers de FIIs separados por vírgula, até 20. Ex.: HGLG11,MXRF11.'
          example: HGLG11,MXRF11
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          description: Fim do trimestre no formato YYYY-MM-DD. Sem valor, retorna o trimestre mais recente de cada FII.
          example: '2025-03-31'
        required: false
        name: referenceDate
        in: query
      - schema:
          type: string
          description: 'Listas a retornar, separadas por vírgula: allocations, properties, financialAssets, fundHoldings, lands, rights. summary sempre vem. Sem valor, retorna todas.'
          example: allocations,fundHoldings
        required: false
        name: include
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
          description: true inclui todas as versões do trimestre. false retorna só a mais recente.
          example: 'false'
        required: false
        name: allVersions
        in: query
      responses:
        '200':
          description: Carteira dos FIIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiiPortfolioResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/fii/properties:
    get:
      tags:
      - Fundos Imobiliários
      operationId: getFiiProperties
      summary: Imóveis e vacância de FIIs
      description: 'Imóveis físicos de FIIs pelo informe trimestral da CVM, com área, endereço, classe, unidades, vacância, inadimplência e participação na receita de cada imóvel.


        Use para analisar FIIs de tijolo, medir a vacância de um fundo e ver quanto da receita depende de cada imóvel.


        `summary.vacancyRate` é a vacância do fundo, ponderada pela área quando o informe traz a área de cada imóvel. `vacancyRate`, `delinquencyRate` e `revenueShare` são frações decimais: `0.0328` é 3,28%.


        Leia `vacancyRate` junto com `revenueShare`. Um imóvel vago com 2% da receita pesa menos que um com 30%.


        Sem `referenceDate`, retorna o trimestre mais recente de cada fundo. O padrão retorna a versão mais recente do informe, e `allVersions=true` retorna todas. Para a série no tempo, use o histórico de imóveis.


        Plano Pro. Sem token, aceita só `symbols` com MXRF11 e HGLG11.'
      security:
      - Bearer: []
      parameters:
      - schema:
          type: string
          description: 'Tickers de FIIs separados por vírgula, até 20. Ex.: HGLG11,MXRF11.'
          example: HGLG11,MXRF11
        required: true
        name: symbols
        in: query
      - schema:
          type: string
          description: Fim do trimestre no formato YYYY-MM-DD. Sem valor, retorna o trimestre mais recente de cada FII.
          example: '2026-03-31'
        required: false
        name: referenceDate
        in: query
      - schema:
          type: string
          enum:
          - revenueShare
          - area
          - vacancyRate
          - name
          default: revenueShare
          description: Campo de ordenação dos imóveis.
          example: revenueShare
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Direção da ordenação dos imóveis.
          example: desc
        required: false
        name: sortOrder
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
          description: true inclui todas as versões do trimestre. false retorna só a mais recente.
          example: 'false'
        required: false
        name: allVersions
        in: query
      responses:
        '200':
          description: Imóveis e vacância dos FIIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiiPropertiesResponse'
        '400':
          description: Requisição inválida. Confira os parâmetros.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Requisição inválida. Um parâmetro falta ou tem valor incorreto.
                  example:
                    error: true
                    message: Parâmetros inválidos
                    code: BAD_REQUEST
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Token ausente ou inválido.
                  example:
                    error: true
                    message: Token de autenticação inválido ou ausente
                    code: UNAUTHORIZED
        '403':
          description: O plano não inclui este recurso ou parâmetro.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Acesso negado. O plano não inclui este recurso.
                  example:
                    error: true
                    message: Você não tem permissão para acessar este recurso
                    code: FORBIDDEN
        '404':
          description: Nenhum dado encontrado para o pedido.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - description: Nenhum dado encontrado para o pedido.
                  example:
                    error: true
                    message: Recurso não encontrado
                    code: NOT_FOUND
        '500':
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/fii/properties/history:
    get:
      tags:
      - Fundos Imobiliários
      operationId: getFiiPropertiesHistory
      summary: Histórico de imóveis de FIIs
      description: 'Série trimestral de imóveis e vacância de FIIs: um ponto por fundo, trimestre e versão do informe, com vacância, área total e quantidade de imóveis em `summary`.


        Use para gráficos de vacância e para acompanhar o tamanho da carteira física no tempo.


